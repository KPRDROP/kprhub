name: Auto-Update WAPA Playlist

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Run WAPA updater
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        APAW_BASE_URL: ${{ secrets.APAW_BASE_URL }}
      run: python apaw.py
    
    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add apaw_vlc.m3u8 apaw_tivimate.m3u8
        git diff --staged --quiet && echo "No changes" || 
        (git commit -m "Update WAPA playlists $(date '+%Y-%m-%d %H:%M:%S')" && 
        git pull --rebase origin main && git push origin main)
