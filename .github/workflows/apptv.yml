name: Apptv Updater

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apptv-updater
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selectolax aiohttp
          pip install brotli

      - name:  Run Apptv updater
        run: |
          echo "Starting Apptv updater..."
          python apptv.py

      - name: Commit & push changes
        run: |
          if [[ -z "$(git status --porcelain apptv.m3u8)" ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apptv.m3u8
          git commit -m "Update Apptv playlist"

          # Sync with remote before pushing, in case another
          # workflow run pushed in the meantime.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && \
              git push origin HEAD:main && \
              break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
