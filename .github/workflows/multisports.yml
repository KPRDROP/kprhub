name: MultiSports Updater

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run playlist updater
        env:
          MULTISPORT_URL: ${{ secrets.MULTISPORT_URL }}
        run: python multisports.py

      - name: Commit & push changes
        run: |
          if [[ -n "$(git status --porcelain multisports.m3u)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add multisports.m3u
            git commit -m "Update Multisports playlist"
            git push
          else
            echo "No changes to commit"
          fi
